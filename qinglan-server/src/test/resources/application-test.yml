spring:
  datasource:
    url: ${QINGLAN_TEST_DB_URL:jdbc:mysql://localhost:3306/qinglan_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${QINGLAN_TEST_DB_USERNAME:root}
    password: ${QINGLAN_TEST_DB_PASSWORD:000000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

qinglan:
  crypto:
    aes-key: cWluZ2xhbi10ZXN0LWFlcy1rZXktMzItYnl0ZXMhISE=
    email-pepper: qinglan-test-pepper
  jwt:
    secret: "cWluZ2xhbi10ZXN0LWp3dC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtMDAwMA=="
    issuer: qinglan
    access-token-ttl: 2h
    email-token-ttl: 10m
  review:
    auto-takedown-threshold: 3
    appeal-window: 7d
  auth:
    code-store: memory
    code-ttl: 5m
    code-length: 6
    max-verify-attempts: 5
    send-interval: 60s
    allowed-email-domains: qinglan.edu.cn
    expose-code: true

logging:
  level:
    com.qinglan: INFO
