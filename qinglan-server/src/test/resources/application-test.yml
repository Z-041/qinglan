spring:
  datasource:
    url: ${QINGLAN_TEST_DB_URL:jdbc:mysql://localhost:3306/qinglan_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${QINGLAN_TEST_DB_USERNAME:root}
    password: ${QINGLAN_TEST_DB_PASSWORD:000000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# 本文件必须**自成一套**：src/main/resources/application.yml 已被 .gitignore 忽略（含本地密钥），
# 干净的 checkout（CI 就是）里根本没有它。任何只写在那个文件里的配置，在这里都必须有对应项，
# 否则 @SpringBootTest 起不来——曾因缺 qinglan.announcement 而整批全上下文测试必红（R-32）。
# 下列取值与 application.example.yml 的生产默认保持一致，便于测试暴露真实行为。
qinglan:
  crypto:
    aes-key: cWluZ2xhbi10ZXN0LWFlcy1rZXktMzItYnl0ZXMhISE=
    email-pepper: qinglan-test-pepper
  jwt:
    secret: "cWluZ2xhbi10ZXN0LWp3dC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtMDAwMA=="
    issuer: qinglan
    access-token-ttl: 2h
    email-token-ttl: 10m
  review:
    auto-takedown-threshold: 3
    appeal-window: 7d
  auth:
    code-store: memory
    code-ttl: 5m
    code-length: 6
    max-verify-attempts: 5
    send-interval: 60s
    allowed-email-domains: qinglan.edu.cn
    expose-code: true
  post:
    min-credit-to-post: 60
    max-images-per-post: 9
  upload:
    max-per-window: 30
    window: 1m
    # 测试里关掉定时回收：@SpringBootTest 会启动调度线程，后台任务不该在事务回滚的用例里跑。
    # 回收逻辑由 UploadOrphanCleanupServiceTest 直接调方法验证
    orphan-cleanup-enabled: false
    orphan-retention: 24h
  announcement:
    min-read-seconds: 5
    max-publishes-per-day: 5
    max-reads-per-window: 30
    read-rate-window: 1m
  moderation:
    # LocalContentGuardTest 是 @SpringBootTest，用的就是这个上下文：它同时验证词库路径与
    # 隐私正则「能不能真的用起来」，因此这里必须给出真实取值，不能留空
    sensitive-word-file: classpath:moderation/sensitive-words.txt
    privacy-rules:
      - label: 身份证
        regex: '[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx]'
      - label: 银行卡
        regex: '(?<!\d)\d{16,19}(?!\d)'
  storage:
    # 测试用本地磁盘实现（与生产 S3 走同一套 StorageService 契约）
    type: local
    local-root: ./target/test-uploads

# 健康检查：测试环境不跑 Redis（code-store=memory），故关掉 Redis 健康指示器，
# 否则 /actuator/health 会因连不上 Redis 报 DOWN。liveness/readiness 子路径需显式开启
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

logging:
  level:
    com.qinglan: INFO
