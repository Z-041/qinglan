# =============================================================================
# 配置模板（入库）。复制本文件为 application.yml（已被 .gitignore 忽略）后填入本地值：
#   cp application.example.yml application.yml
# application.yml 不要提交，真实密钥/密码只通过本地文件或环境变量提供。
#
# profile 约定：
#   dev  本地默认（不激活任何 profile），本文件即开发态取值
#   test 测试（@ActiveProfiles("test") 加载 application-test.yml）
#   prod 生产（部署时显式 SPRING_PROFILES_ACTIVE=prod）；激活后由 ProdEnvironmentGuard
#        校验以下硬约束，任一不满足即拒绝启动：expose-code=false、code-store/store.type=redis、
#        storage.type=s3、storage.image-signing-secret 显式配置、ddl-auto 非 create/create-drop/update、
#        datasource 不指向本机
# =============================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: qinglan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${QINGLAN_DB_URL:jdbc:mysql://localhost:3306/qinglan?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${QINGLAN_DB_USERNAME:root}
    password: ${QINGLAN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 Flyway 管理，Hibernate 只做校验，禁止自动改表
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${QINGLAN_REDIS_HOST:localhost}
      port: ${QINGLAN_REDIS_PORT:6379}
      # 生产必填：Redis 须开启 requirepass（见 docker-compose.yml 的 redis 服务）。
      # 本地/测试无 Redis 时可留空。密码与 docker-compose 的 REDIS_PASSWORD 必须一致；
      # 轮换后所有实例须同时重启——验证码等短时效数据随之失效，用户重发即可，影响可接受。
      password: ${QINGLAN_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

qinglan:
  crypto:
    # 必填：32 字节 Base64 编码的 AES-256 密钥，缺失即启动失败；生产走环境变量
    aes-key: ${QINGLAN_CRYPTO_AES_KEY:}
    # 必填：邮箱/学号不可逆哈希的固定盐，必须长期保持不变，否则历史数据无法匹配
    email-pepper: ${QINGLAN_CRYPTO_EMAIL_PEPPER:}
  jwt:
    # 必填：至少 32 字节的 Base64，缺失或过短会启动失败
    secret: ${QINGLAN_JWT_SECRET:}
    issuer: qinglan
    access-token-ttl: 2h
    email-token-ttl: 10m
  auth:
    # memory=单机内存（本地/测试）；redis=集群共享（生产）
    code-store: ${QINGLAN_AUTH_CODE_STORE:memory}
    code-ttl: 5m
    code-length: 6
    max-verify-attempts: 5
    send-interval: 60s
    # 必填：校园邮箱域名白名单（逗号分隔多个），留空即拒绝所有邮箱（fail-closed）
    allowed-email-domains: ${QINGLAN_AUTH_EMAIL_DOMAINS:}
    # 仅本地联调可置 true（响应体回显验证码）；生产必须保持 false
    expose-code: ${QINGLAN_AUTH_EXPOSE_CODE:false}
    mail:
      # 验证码投递通道：logging=只打日志（本地/CI 默认，不配 SMTP 也能启动）；smtp=真实发信
      transport: ${QINGLAN_AUTH_MAIL_TRANSPORT:logging}
      host: ${QINGLAN_AUTH_MAIL_HOST:}
      port: ${QINGLAN_AUTH_MAIL_PORT:587}
      username: ${QINGLAN_AUTH_MAIL_USERNAME:}
      # 只允许环境变量注入，禁止写死（AGENTS.md 第九章：密钥走环境变量）
      password: ${QINGLAN_AUTH_MAIL_PASSWORD:}
      from: ${QINGLAN_AUTH_MAIL_FROM:no-reply@qinglan.edu.cn}
      # 587 提交端口一般开 STARTTLS；465 隐式 TLS 场景另行处理
      tls: ${QINGLAN_AUTH_MAIL_TLS:true}
  post:
    min-credit-to-post: 60
    max-images-per-post: 9
  moderation:
    sensitive-word-file: classpath:moderation/sensitive-words.txt
    privacy-rules:
      - label: 身份证
        regex: '[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx]'
      - label: 银行卡
        regex: '(?<!\d)\d{16,19}(?!\d)'
  review:
    auto-takedown-threshold: 3
    appeal-window: 7d
  announcement:
    min-read-seconds: 5
    max-publishes-per-day: 5
    max-reads-per-window: 30
    read-rate-window: 1m
  upload:
    max-per-window: 30
    window: 1m
    # 孤儿回收：上传后超过保留期仍未绑定到任何帖子的对象会被删除（对象 + 登记行）
    orphan-cleanup-enabled: ${QINGLAN_UPLOAD_ORPHAN_CLEANUP_ENABLED:true}
    orphan-retention: ${QINGLAN_UPLOAD_ORPHAN_RETENTION:24h}
  store:
    # memory=单机内存（本地/测试）；redis=集群共享（生产）
    type: ${QINGLAN_STORE_TYPE:memory}
  storage:
    # 存储实现：local=本地磁盘（本地/测试）；s3=S3 兼容对象存储（生产，prod 守卫强制要求）
    type: ${QINGLAN_STORAGE_TYPE:local}
    # 仅 type=local 时生效
    local-root: ${QINGLAN_STORAGE_ROOT:./data/uploads}
    # 私有图片（待审 / 下架 / 未绑定上传）签名 URL 的 HMAC 密钥。
    # 生产必填、不得依赖回落到 qinglan.jwt.secret（prod 守卫强制）；留空时回落 qinglan.jwt.secret，
    # 仅为本地/测试便利（权宜）。密钥只走环境变量注入，禁止写死（AGENTS.md 第九章）。
    image-signing-secret: ${QINGLAN_STORAGE_IMAGE_SIGNING_SECRET:}
    # 签名有效期：留空默认 10 分钟；硬上限 1 小时（配置更大值会被收敛到 1 小时，越小泄漏面越小）
    image-signing-ttl: 10m
    # 仅 type=s3 时生效：endpoint/bucket/access-key/secret-key 四项必填（缺失即启动失败并给出中文原因），
    # region 可留空（默认 us-east-1）。可对接自建 MinIO / 腾讯 COS / 阿里 OSS。
    # 凭据只允许环境变量注入，禁止写死（AGENTS.md 第九章）
    s3:
      endpoint: ${QINGLAN_S3_ENDPOINT:}
      region: ${QINGLAN_S3_REGION:}
      bucket: ${QINGLAN_S3_BUCKET:}
      access-key: ${QINGLAN_S3_ACCESS_KEY:}
      secret-key: ${QINGLAN_S3_SECRET_KEY:}
  security:
    # 信任的代理跳数：默认 0 = 不信任任何代理，只取 TCP 对端地址（客户端无法伪造 XFF）。
    # 前置 nginx 等代理时才按实际层数递增（如 1 层设 1），见 IpRateLimitFilter 的取舍说明
    trusted-proxy-hops: ${QINGLAN_TRUSTED_PROXY_HOPS:0}
    rate-limit:
      enabled: ${QINGLAN_RATE_LIMIT_ENABLED:true}
      # 窗口内单 IP 请求数上限（默认 20/min，不影响正常低频用户）
      max-requests: ${QINGLAN_RATE_LIMIT_MAX:20}
      window: 1m
      # 受保护路径（Ant 风格）：优先保护验证码发送这类敏感端点
      paths:
        - /api/auth/email/code

# 健康检查：仅暴露 health（含 liveness/readiness 子路径），其余端点不开放
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      # 默认 memory 存储、无 Redis：关掉 Redis 健康指示器，避免把「未使用 Redis」误报成 DOWN。
      # 生产用 Redis 时置 true，把 Redis 纳入健康检查
      enabled: ${QINGLAN_REDIS_HEALTH:false}

logging:
  pattern:
    # 在日志级别后追加 traceId（TraceIdFilter 写入 MDC），便于按请求串联排查
    level: "%5p [%X{traceId:-}]"
  # 结构化日志（生产可开）：取消下面三行注释即输出 JSON（Spring Boot 3.4+ 内置 structured logging）。
  # 默认保持人类可读，方便本地开发
  #  structured:
  #    format:
  #      console: ecs

