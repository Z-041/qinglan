# =============================================================================
# 配置模板（入库）。复制本文件为 application.yml（已被 .gitignore 忽略）后填入本地值：
#   cp application.example.yml application.yml
# application.yml 不要提交，真实密钥/密码只通过本地文件或环境变量提供。
# =============================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: qinglan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${QINGLAN_DB_URL:jdbc:mysql://localhost:3306/qinglan?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${QINGLAN_DB_USERNAME:root}
    password: ${QINGLAN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 Flyway 管理，Hibernate 只做校验，禁止自动改表
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${QINGLAN_REDIS_HOST:localhost}
      port: ${QINGLAN_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

qinglan:
  crypto:
    # 必填：32 字节 Base64 编码的 AES-256 密钥，缺失即启动失败；生产走环境变量
    aes-key: ${QINGLAN_CRYPTO_AES_KEY:}
    # 必填：邮箱/学号不可逆哈希的固定盐，必须长期保持不变，否则历史数据无法匹配
    email-pepper: ${QINGLAN_CRYPTO_EMAIL_PEPPER:}
  jwt:
    # 必填：至少 32 字节的 Base64，缺失或过短会启动失败
    secret: ${QINGLAN_JWT_SECRET:}
    issuer: qinglan
    access-token-ttl: 2h
    email-token-ttl: 10m
  auth:
    # memory=单机内存（本地/测试）；redis=集群共享（生产）
    code-store: ${QINGLAN_AUTH_CODE_STORE:memory}
    code-ttl: 5m
    code-length: 6
    max-verify-attempts: 5
    send-interval: 60s
    # 必填：校园邮箱域名白名单（逗号分隔多个），留空即拒绝所有邮箱（fail-closed）
    allowed-email-domains: ${QINGLAN_AUTH_EMAIL_DOMAINS:}
    # 仅本地联调可置 true（响应体回显验证码）；生产必须保持 false
    expose-code: ${QINGLAN_AUTH_EXPOSE_CODE:false}
  post:
    min-credit-to-post: 60
    max-images-per-post: 9
  moderation:
    sensitive-word-file: classpath:moderation/sensitive-words.txt
    privacy-rules:
      - label: 身份证
        regex: '[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx]'
      - label: 银行卡
        regex: '(?<!\d)\d{16,19}(?!\d)'
  review:
    auto-takedown-threshold: 3
    appeal-window: 7d
  announcement:
    min-read-seconds: 5
    max-publishes-per-day: 5
    max-reads-per-window: 30
    read-rate-window: 1m
  upload:
    max-per-window: 30
    window: 1m
  store:
    # memory=单机内存（本地/测试）；redis=集群共享（生产）
    type: ${QINGLAN_STORE_TYPE:memory}
  storage:
    # 本地开发用磁盘目录；生产切对象存储后本项不再生效
    local-root: ${QINGLAN_STORAGE_ROOT:./data/uploads}
