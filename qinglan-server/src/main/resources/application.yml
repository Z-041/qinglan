server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: qinglan-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${QINGLAN_DB_URL:jdbc:mysql://localhost:3306/qinglan?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${QINGLAN_DB_USERNAME:root}
    password: ${QINGLAN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 Flyway 管理，Hibernate 只做校验，禁止自动改表
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${QINGLAN_REDIS_HOST:localhost}
      port: ${QINGLAN_REDIS_PORT:6379}
  servlet:
    multipart:
      # 与 post 模块的单张图片上限保持一致，超出直接拒绝，不让请求进到业务层
      max-file-size: 5MB
      max-request-size: 10MB

qinglan:
  crypto:
    # 32 字节 Base64 编码的 AES-256 密钥，仅本地/测试配置提供，生产走环境变量
    aes-key: ${QINGLAN_CRYPTO_AES_KEY:}
    # 用于邮箱/学号不可逆哈希的固定盐，必须长期保持不变，否则历史数据无法匹配
    email-pepper: ${QINGLAN_CRYPTO_EMAIL_PEPPER:}
  jwt:
    secret: ${QINGLAN_JWT_SECRET:}
    issuer: qinglan
    access-token-ttl: 2h
    email-token-ttl: 10m
  auth:
    # memory=单机内存（本地/测试）；redis=集群共享（生产）
    code-store: ${QINGLAN_AUTH_CODE_STORE:memory}
    code-ttl: 5m
    code-length: 6
    max-verify-attempts: 5
    send-interval: 60s
    # 校园邮箱域名白名单，必须显式配置；留空即拒绝所有邮箱（fail-closed）
    allowed-email-domains: ${QINGLAN_AUTH_EMAIL_DOMAINS:}
    # 仅限本地联调：为 true 时响应体回显验证码。生产必须保持 false
    expose-code: false
  post:
    # 信用分低于该值不允许发帖（设计方案：违规扣分，低于阈值限制发帖）
    min-credit-to-post: 60
    # 单个帖子的图片数量上限（设计方案：≤9 图）
    max-images-per-post: 9
  moderation:
    # 本地硬拦截词库（classpath 资源，一行一词，# 开头为注释）
    sensitive-word-file: classpath:moderation/sensitive-words.txt
    # 隐私信息正则，命中即拒绝发布。默认只拦身份证与银行卡；
    # 学号规则刻意留空——\d{9,12} 会把 11 位手机号一起误拦，等确认真实格式后再在此追加，不改代码
    privacy-rules:
      - label: 身份证
        regex: '[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx]'
      - label: 银行卡
        regex: '(?<!\d)\d{16,19}(?!\d)'
  review:
    # 待处理举报数达到该值时帖子自动下架，转人工复核（设计方案：N=3）
    auto-takedown-threshold: 3
    # 申诉期限：自下架时刻起算，超期不再受理（设计方案：7 日内）
    appeal-window: 7d
  upload:
    # 单个用户在窗口内的上传次数上限，防止刷爆对象存储
    max-per-window: 30
    # 上传限流窗口；计数窗口从该用户第一次上传时开始计时
    window: 1m
  store:
    # 短时效存储实现：memory=单机内存（本地/测试）；redis=集群共享（生产）
    type: ${QINGLAN_STORE_TYPE:memory}
  storage:
    # 本地开发用磁盘目录；生产切对象存储后本项不再生效
    local-root: ${QINGLAN_STORAGE_ROOT:./data/uploads}
