name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-static-analysis:
    name: Backend static analysis (ArchUnit + javac lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qinglan-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # 独立成 job 的理由：不依赖 MySQL，最快失败、归因清晰。
      # 两道门禁都在编译/测试阶段生效，不需要额外插件：
      #   1) maven-compiler-plugin 的 -Xlint:all,-processing -Werror（编译期警告即错误）
      #   2) ModuleBoundaryTest 用 ArchUnit 校验 AGENTS.md 第三章的跨模块白名单与 Controller 分层
      - name: Architecture & compiler lint
        run: ./mvnw -B -ntp -Dtest=ModuleBoundaryTest -DfailIfNoTests=false test

  backend:
    name: Backend (Java 21 + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "000000"
          MYSQL_DATABASE: qinglan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p000000"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: qinglan-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # 测试走真实 MySQL（application-test.yml 指向 localhost:3306/qinglan_test）
      - name: Run backend tests
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (Vue 3 + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qinglan-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: qinglan-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm vue-tsc --noEmit
      - name: Unit tests
        run: pnpm vitest run
