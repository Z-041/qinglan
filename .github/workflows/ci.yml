name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-static-analysis:
    name: Backend static analysis (ArchUnit + javac lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qinglan-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # 独立成 job 的理由：不依赖 MySQL，最快失败、归因清晰。
      # 两道门禁都在编译/测试阶段生效，不需要额外插件：
      #   1) maven-compiler-plugin 的 -Xlint:all,-processing -Werror（编译期警告即错误）
      #   2) ModuleBoundaryTest 用 ArchUnit 校验 AGENTS.md 第三章的跨模块白名单与 Controller 分层
      - name: Architecture & compiler lint
        run: ./mvnw -B -ntp -Dtest=ModuleBoundaryTest -DfailIfNoTests=false test

  backend:
    name: Backend (Java 21 + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "000000"
          MYSQL_DATABASE: qinglan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p000000"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: qinglan-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # 测试走真实 MySQL（application-test.yml 指向 localhost:3306/qinglan_test）
      - name: Run backend tests
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (${{ matrix.package }})
    runs-on: ubuntu-latest
    # 前端已拆成三个 pnpm workspace 包：shared（共享）/ qinglan-web（学生端）/ qinglan-admin（管理端）。
    # fail-fast: false 让三包的失败都能报出来，而不是第一个红了就掐掉其余。
    strategy:
      fail-fast: false
      matrix:
        package: [shared, qinglan-web, qinglan-admin]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          # workspace 根只有一个 lockfile（拆分时已从 qinglan-web/ 上移）
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        # 必须在 workspace 根安装：三个包共用一份 lockfile 与虚拟store
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # 用各包自己的 typecheck 脚本（qinglan-admin 的 ElMessageBox 等自动导入声明已入库，
      # 否则新克隆的仓库首次 typecheck 会报 TS2304）
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
