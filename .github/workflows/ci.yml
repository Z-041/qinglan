name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-static-analysis:
    name: Backend static analysis (ArchUnit + javac lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qinglan-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # 独立成 job 的理由：不依赖 MySQL，最快失败、归因清晰。
      # 两道门禁都在编译/测试阶段生效，不需要额外插件：
      #   1) maven-compiler-plugin 的 -Xlint:all,-processing -Werror（编译期警告即错误）
      #   2) ModuleBoundaryTest 用 ArchUnit 校验 AGENTS.md 第三章的跨模块白名单与 Controller 分层
      - name: Architecture & compiler lint
        run: ./mvnw -B -ntp -Dtest=ModuleBoundaryTest -DfailIfNoTests=false test

  backend:
    name: Backend (Java 21 + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "000000"
          MYSQL_DATABASE: qinglan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p000000"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Redis 7 service：让 RedisVerificationCodeStore / RedisEphemeralStore 的真跑测试在 CI 真正执行
      # （本地无 Redis 时这些测试由 QINGLAN_REDIS_TEST 条件自动跳过）
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: qinglan-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # 测试走真实 MySQL（application-test.yml 指向 localhost:3306/qinglan_test）；
      # QINGLAN_REDIS_TEST=true 打开 Redis 路径的真跑测试，指向下面 redis service。
      # S3 用例（S3StorageServiceTest）用内嵌 S3Mock，纯 Java、无需额外 service，随本次 test 一起真跑。
      - name: Run backend tests
        env:
          QINGLAN_REDIS_TEST: "true"
          QINGLAN_REDIS_HOST: "127.0.0.1"
          QINGLAN_REDIS_PORT: "6379"
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (${{ matrix.package }})
    runs-on: ubuntu-latest
    # 前端已拆成三个 pnpm workspace 包：shared（共享）/ qinglan-web（学生端）/ qinglan-admin（管理端）。
    # fail-fast: false 让三包的失败都能报出来，而不是第一个红了就掐掉其余。
    strategy:
      fail-fast: false
      matrix:
        package: [shared, qinglan-web, qinglan-admin]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          # workspace 根只有一个 lockfile（拆分时已从 qinglan-web/ 上移）
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        # 必须在 workspace 根安装：三个包共用一份 lockfile 与虚拟store
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  frontend-audit:
    name: Frontend dependency audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Audit production dependencies
        # 只审生产依赖（--prod）：开发依赖链（vitest/tinypool/braces 等）的公告不阻断合并，
        # 但生产面出现 high/critical 必须挡住——本轮就是靠它抓出 echarts 的 XSS 公告。
        # 必须显式指定官方 registry：国内镜像（npmmirror）未实现 audit 端点，
        # 用默认源会直接报 ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS（本机已复现）。
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
