# =============================================================================
# 青栏全栈编排（MySQL + Redis + 后端 + nginx）。
#
# 用法：
#   cp .env.example .env                      # 填好全部值（含所有密钥）
#   pnpm install && pnpm -r build             # 在仓库根构建两个前端产物 dist/
#   docker compose build && docker compose up -d
#
# 拓扑：只有 nginx 对外发布端口（默认 80）。app / mysql / redis 都在内部网络，
# 不对外暴露端口，减少攻击面。外部流量：/ -> 学生端、/admin/ -> 管理端、
# /api 与 /uploads -> 后端（见 deploy/nginx.conf）。
#
# 安全：真实 .env 只由部署方生成、且必须不入库（仓库根 .gitignore 已忽略 .env）。
# =============================================================================

name: qinglan

services:
  # ----------------------------- MySQL 8 -----------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 字符集/时区与后端 JDBC URL 对齐：
    #   application.yml 的 URL 带 characterEncoding=utf8 & serverTimezone=UTC，
    #   故服务端用 utf8mb4（utf8 的超集）+ UTC，避免「JDBC 认为 UTC、库里却是本地时区」
    #   导致的时间漂移与中文/emoji 乱码。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      TZ: UTC
      # 复用后端的库/账号变量，避免「mysql 建了 A 账号、后端连 B 账号」这类两处不一致。
      # 变量未设置时 compose 直接报错退出（fail-fast，不留有风险的默认值）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请在 .env 中填写}
      MYSQL_DATABASE: ${QINGLAN_DB_NAME:-qinglan}
      # 应用专用账号（最小权限）：后端用这个账号连库，不用 root
      MYSQL_USER: ${QINGLAN_DB_USERNAME:-qinglan}
      MYSQL_PASSWORD: ${QINGLAN_DB_PASSWORD:?QINGLAN_DB_PASSWORD 未设置，请在 .env 中填写}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用应用账号 ping（root 也可）；--silent 让成功时无输出
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [qinglan]

  # ----------------------------- Redis 7 -----------------------------
  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      # 通过环境变量传密码而非直接写在 command 里：command 会被 `docker inspect` 明文看到，
      # 这里改用 sh -c 让 $REDIS_PASSWORD 在容器内展开（进程 args 仍在，但镜像/编排文件里无明文）。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请在 .env 中填写}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [qinglan]
    # 应用侧对应关系：.env 里 QINGLAN_REDIS_PASSWORD 必须与这里的 REDIS_PASSWORD 一致，
    # 后端经 spring.data.redis.password（application.example.yml 已补该字段）读取。
    # 生产还须 QINGLAN_AUTH_CODE_STORE=redis、QINGLAN_STORE_TYPE=redis（否则 prod 守卫拒绝启动）。

  # --------------------------- 后端应用 ---------------------------
  app:
    build:
      context: .                       # 上下文 = 仓库根（见 Dockerfile 顶部说明）
      dockerfile: Dockerfile
    # 用环境变量选定镜像 tag，便于回滚：改 QINGLAN_IMAGE_TAG 指向旧 tag 再 up -d
    image: qinglan-server:${QINGLAN_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env                            # 全部密钥/配置只来自 .env，不写死在编排里
    environment:
      TZ: UTC
    volumes:
      # 上传文件持久化；与 Dockerfile 的 /app/data/uploads、QINGLAN_STORAGE_ROOT 一致
      - uploads-data:/app/data/uploads
    depends_on:
      # 等 mysql/redis 健康后再启动：否则 Flyway 迁移会撞上「库还没起来」
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [qinglan]
    # 不对外发布 8080：外部一律经 nginx（deploy/nginx.conf）

  # ----------------------------- nginx -----------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # 只在此处对外发布。HTTP_PORT 可在 .env 调整
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 配置：反代 + 静态托管 + 安全响应头（X-Frame-Options / frame-ancestors）
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 两个前端产物：先 `pnpm -r build` 生成，再挂进来（nginx 只读）
      - ./qinglan-web/dist:/usr/share/nginx/html/web:ro
      - ./qinglan-admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - app
    networks: [qinglan]

volumes:
  mysql-data:      # 数据库数据
  redis-data:      # Redis AOF（验证码/计数等短时效数据；丢了也只是让用户重发验证码）
  uploads-data:    # 上传的图片（本地磁盘实现；切对象存储后此卷可退场）

networks:
  qinglan:
    driver: bridge
