# =============================================================================
# 青栏 nginx 配置（静态托管 + 反向代理）。
# 由 docker-compose.yml 只读挂载到 /etc/nginx/conf.d/default.conf，是整个 nginx
# 唯一启用的 server 块（nginx 镜像默认的 conf.d/default.conf 已被本文件覆盖）。
#
# 同源部署（AGENTS.md 第七章）：学生端在 /、管理端在 /admin/、后端在 /api 与 /uploads，
# 四者同源 → localStorage 共用一把令牌键，维持「一个浏览器 = 一个账号 = 一份会话」。
# =============================================================================

# 上游后端。app 是 compose 服务名，同一 network 内可解析。
upstream qinglan_app {
    server app:8080;
}

server {
    listen      80;
    server_name _;

    # 不回显 nginx 版本号，减少指纹
    server_tokens off;

    # 与后端 spring.servlet.multipart.max-request-size=10MB 对齐：
    # 单张图片上限 5MB（ImageUploadService.MAX_IMAGE_BYTES 与 max-file-size=5MB），
    # 但一次上传请求还要带 multipart 边界/头部，故按 request 上限 10m 设，而不是单文件 5m。
    # nginx 先拦，超限直接 413，不让请求打到后端。
    client_max_body_size 10m;

    # ---------- 安全响应头（T-14）----------
    # frame-ancestors 写在 index.html 的 <meta> 里会被浏览器忽略，防点击劫持只能靠响应头：
    #   X-Frame-Options 供老浏览器，CSP frame-ancestors 供现代浏览器，两者一起发。
    # ⚠️ nginx 的 add_header 在子 location 里是「覆盖」父级而非追加：凡在 location 内另加
    #    add_header 的，下面这几条都要在该 location 里重新声明一遍（本文件已逐处补齐）。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # 压缩文本类资源（JS/CSS/JSON/SVG）。图片/JPG/PNG 已是压缩格式，不重复压缩。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/xml image/svg+xml;

    # ======================= 学生端 SPA（/）=======================
    location / {
        root /usr/share/nginx/html/web;
        # SPA 前端路由：文件不存在时回退到**学生端自己的** index.html
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：它是引用「带哈希资源」的入口，缓存住会把旧版本锁在浏览器里。
    # no-cache 表示每次都要回源校验（可用 304 省流量），区别于 no-store。
    location = /index.html {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # 学生端带内容哈希的静态资源（Vite 产物在 /assets/ 下，文件名含 hash）。
    # 内容变则文件名变，可安全长缓存 + immutable（浏览器不再发校验请求）。
    location ^~ /assets/ {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # ======================= 管理端 SPA（/admin/）=======================
    # 管理端 Vite base 与 router 都是 /admin/，产物挂载在 html/admin。
    # ⚠️ 关键坑（T-14）：try_files 的回退必须指向**管理端自己的** /admin/index.html。
    #    若误写成 /index.html，则 /admin/xxx 刷新会落到学生端 location、渲染出学生端页面。
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # /admin（无尾斜杠）补成 /admin/，否则会匹配到学生端 location / 而找不到文件
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # 管理端带内容哈希的静态资源（html/admin/assets/...）
    location ^~ /admin/assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # ======================= 后端 API =======================
    location /api/ {
        proxy_pass http://qinglan_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 真实客户端 IP 的传递：后端 IpRateLimitFilter 依 qinglan.security.trusted-proxy-hops
        # 取 XFF 右起第 hops 跳。本部署只有这一层 nginx，故生产必须设
        # QINGLAN_TRUSTED_PROXY_HOPS=1。用 $proxy_add_x_forwarded_for（追加客户端自报的 XFF），
        # 配合 hops=1 时取最右一跳 = nginx 看到的 TCP 对端 = 真实客户端，伪造的左段被丢弃。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        # 后端只返回 JSON/图片，不需要缓冲大响应
        proxy_buffering on;
    }

    # ======================= 上传的图片 =======================
    # 图片由后端受控端点 GET /uploads/** 下发（ImageDeliveryController）：按帖子可见性校验，
    # 下架帖的图对游客立即 404。故这里必须反代到 app，**不能**再做静态托管（原静态映射已移除）。
    # ⚠️ 缓存头由后端下发（短 TTL，且响应随访问者身份变化），本 location 不再 add_header Cache-Control，
    #    否则会与后端响应头叠加成两个 Cache-Control 值。安全响应头沿用 server 级（与 /api 同一处理）。
    # 用 ^~ 让前缀匹配优先于通用的静态后缀正则，避免图片被当成 assets 处理。
    location ^~ /uploads/ {
        proxy_pass http://qinglan_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 与 /api 一致：真实客户端 IP 由后端按 qinglan.security.trusted-proxy-hops 从 XFF 右起取
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
